[pytest]
testpaths = tests
norecursedirs = vllm .git .venv results
addopts = -m "not original_history"
markers =
    original_history: opt-in checks requiring a separately provided original checkout
    posix_directory_fsync: directory descriptor durability semantics available on POSIX
    optional_torch: local tensor-only tests requiring an installed torch package
    optional_graphiti: local compatibility tests requiring an installed Graphiti package
    optional_transformers: local compatibility tests requiring an installed Transformers package
    platform_specific: tests requiring OS-specific filesystem or shell capabilities
